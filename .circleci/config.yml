version: 2.1
jobs:
  mac-swift6-4-1:
    macos:
      xcode: "27.1.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Install Swift 6.4.1
          command: |
            curl --fail --location --retry 3 \
              https://download.swift.org/swift-6.4.1-release/xcode/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-osx.pkg \
              --output /tmp/swift-6.4.1.pkg
            installer -target CurrentUserHomeDirectory -pkg /tmp/swift-6.4.1.pkg
            toolchain="$HOME/Library/Developer/Toolchains/swift-6.4.1-RELEASE.xctoolchain"
            toolchain_id=$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")
            printf 'export TOOLCHAINS="%s"\n' "$toolchain_id" >> "$BASH_ENV"
            printf 'export PATH="%s/usr/bin:$PATH"\n' "$toolchain" >> "$BASH_ENV"
      - run:
          name: Verify Swift 6.4.1
          command: |
            swift --version | tee /tmp/swift-version.txt
            grep -Eq 'Swift version 6\.4\.1([[:space:]]|$)' /tmp/swift-version.txt
      - run: swift build
      - run: swift test
  linux-swift6-4-1:
    docker:
      - image: swift:6.4.1-noble
    steps:
      - checkout
      - run:
          name: Verify Swift 6.4.1
          command: |
            swift --version | tee /tmp/swift-version.txt
            grep -Eq 'Swift version 6\.4\.1([[:space:]]|$)' /tmp/swift-version.txt
      - run: swift build
      - run: swift test
workflows:
  build_and_test:
    jobs:
      - mac-swift6-4-1
      - linux-swift6-4-1
